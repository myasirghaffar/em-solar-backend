# Cloudflare Worker — em-solar-api
#
# Secrets (never commit values — set in Dashboard or CLI, mirror em-solar-backend/.env):
#   wrangler secret put DATABASE_URL     # Transaction pooler :6543, user postgres.geqhoiiqwlymljdgppco, URL-encoded password
#   wrangler secret put JWT_ACCESS_SECRET
#   wrangler secret put JWT_REFRESH_SECRET
#   wrangler secret put RESEND_API_KEY     # optional
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY  # optional
#
# Local `wrangler dev`: copy DATABASE_URL + JWT_* from `.env` into `.dev.vars` (gitignored).
# Local `npm run dev` (Node): uses `.env` only.
#
# Supabase project: geqhoiiqwlymljdgppco | pooler host: aws-1-ap-south-1.pooler.supabase.com
# Do not add VITE_API_URL here — frontend build-time only (em-solar/.env).

name = "em-solar-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
# Auth token lifetimes (match .env)
JWT_ACCESS_EXPIRATION = "1h"
JWT_REFRESH_EXPIRATION = "7d"

# CORS — exact origins, no trailing slash (match .env / Cloudflare dashboard)
ALLOWED_ORIGINS = "http://localhost:5173,https://energymart-pk.vercel.app,https://em-solar.ghaffaryasir28.workers.dev"

# Public / non-secret app config (match .env)
ENVIRONMENT = "production"
WORKER_COMPAT_DATE = "2025-04-01"
FRONTEND_APP_URL = "https://energymart-pk.vercel.app"
EMAIL_FROM = "EnergyMart <onboarding@resend.dev>"
DEV_EXPOSE_EMAIL_LINKS = "true"

# Hyperdrive → Supabase (production). Configure connection in Cloudflare dashboard with the same
# pooler URI as DATABASE_URL in .env (transaction mode, port 6543).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "03968b8e83ee42ceb48cd26123a80f3d"
# Optional for `wrangler dev` when HYPERDRIVE is used without DATABASE_URL in .dev.vars:
# localConnectionString = "postgresql://postgres.geqhoiiqwlymljdgppco:ENCODED_PASSWORD@aws-1-ap-south-1.pooler.supabase.com:6543/postgres?pgbouncer=true"
